<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- No contêiner da suíte, «Segoe UI» (a letra dos balcões, no Windows) é a Selawik,
     de medidas iguais. Ver ci/suite/Dockerfile. -->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable Text</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
