{#- OS BALÕES DA CONVERSA (27/10/2026). O mesmo parcial desenha a primeira carga
    (`whatsapp_chat.html`) e as mensagens novas do `/whatsapp/<id>/novas`: um
    desenho só. O texto do cliente sai pelo escape automático do Jinja — um
    cliente pode mandar `<script>` pelo WhatsApp —, e o JavaScript só pendura
    este HTML já escapado, sem montar nada com o texto. -#}
{% for m in mensagens %}
{% if m.retomada %}<div class="wa-dia wa-retomada" role="separator"><span>— atendimento retomado{% if m.retomada_em %} em {{ m.retomada_em }}{% endif %} —</span></div>{% endif %}
{% if m.separador %}<div class="wa-dia" role="separator"><span>{{ m.separador }}</span></div>{% endif %}
<div class="wa-balao {{ 'wa-out' if m.direcao == 'out' else 'wa-in' }}" data-id="{{ m.id }}"{% if m.pendente %} data-wa-pendente="{{ m.pendente }}"{% endif %}{% if m.envio_token %} data-wa-token="{{ m.envio_token }}"{% endif %}{% if m.meta_id %} title="{{ m.meta_id }}"{% endif %}>
  {% if m.tipo == 'modelo' %}<span class="wa-marca">modelo</span>
  {% elif m.tipo == 'aviso' %}<span class="wa-marca">aviso automático</span>
  {% elif m.tipo == 'audio' %}<span class="wa-marca">áudio</span>
  {% elif m.tipo and m.tipo not in ('text', 'texto') %}<span class="wa-marca">{{ {'image': 'foto', 'document': 'documento', 'video': 'vídeo', 'sticker': 'figurinha'}.get(m.tipo, m.tipo) }}</span>{% endif %}
  {#- O ARQUIVO DA CONVERSA (29/10/2026, `wa_midia`): a foto, o PDF, o áudio e o
      vídeo aparecem aqui; o resto tem o link de baixar. O endereço é o da rota
      do WhatsApp, e o nome do arquivo sai pelo escape do Jinja. -#}
  {% set mostrar = como_mostrar(m) if como_mostrar is defined else '' %}
  {% if mostrar %}
  {% set link = url_for('whatsapp_midia', mensagem_id=m.id) %}
  <div class="wa-arquivo">
    {% if mostrar == 'foto' %}<a href="{{ link }}" target="_blank" rel="noopener"><img class="wa-foto" src="{{ link }}" alt="foto enviada na conversa" loading="lazy"></a>
    {% elif mostrar == 'audio' %}<audio controls preload="none" src="{{ link }}"></audio>
    {% elif mostrar == 'video' %}<video class="wa-video" controls preload="none" src="{{ link }}"></video>
    {% elif mostrar == 'pdf' %}<a href="{{ link }}" target="_blank" rel="noopener">📄 abrir o PDF</a>{% endif %}
    <a class="wa-baixar" href="{{ url_for('whatsapp_midia', mensagem_id=m.id, baixar=1) }}">⬇ {{ m.arquivo_nome or 'baixar' }}{% if m.arquivo_bytes %} <span class="muted">({{ (m.arquivo_bytes / 1024)|round(0)|int }} KB)</span>{% endif %}</a>
  </div>
  {% elif m.midia_id and m.direcao == 'in' %}
  <div class="wa-arquivo small">
    {% if m.midia_situacao == 'erro' %}o arquivo não foi baixado: {{ m.arquivo_erro or 'falhou' }}
    <form method="post" action="{{ url_for('whatsapp_midia_tentar', mensagem_id=m.id) }}" class="wa-tentar">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="button secondary">tentar de novo</button>
    </form>
    {% else %}baixando o arquivo…{% endif %}
  </div>
  {% endif %}
  {% if m.tipo == 'audio' %}
  <div class="wa-transcricao">
    {% if m.transcricao %}transcrição (IA, conferir): «{{ m.transcricao }}»
    {% elif m.transcricao is not none %}a transcrição não saiu; ouça pelo aplicativo
    {% else %}sem transcrição{% endif %}
  </div>
  {% endif %}
  {% if m.texto or m.tipo != 'audio' %}<div class="wa-texto">{{ m.texto or '—' }}</div>{% endif %}
  <div class="wa-hora">
    {{ (m.criado_em or '')[11:16] }}
    {% if m.direcao == 'out' %}
    · {% if m.tipo == 'aviso' %}aviso automático{% elif m.autor == 'ia' %}resposta automática (IA){% elif m.tipo == 'modelo' %}modelo enviado{% else %}enviada{% if m.autor %} por {{ m.autor }}{% endif %}{% endif %}
    {#- A ENTREGA (29/10/2026): ✓ saiu, ✓✓ chegou, ✓✓ azul leu, ⚠ não chegou. O
        span sai SEMPRE, mesmo vazio: o `/novas` atualiza por atributo e
        `textContent`, sem montar HTML. O texto é o do `rotulo_da_entrega`. -#}
    {% set ent = wa_rotulo_da_entrega(m.entrega, m.entrega_erro) %}
    <span class="wa-entrega" data-wa-entrega-de="{{ m.id }}" data-wa-entrega="{{ ent.entrega }}"
          {% if ent.titulo %}title="{{ ent.titulo }}"{% endif %}>{{ ent.marca }}</span>
    {% endif %}
  </div>
</div>
{% endfor %}
