{% extends 'base.html' %}{% block heading %}<h1>TI/Infra #{{row.id}}</h1>{% endblock %}{% block content %}<section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Tipo<input name="kind" value="{{row.kind}}"></label><label>Nome<input name="name" value="{{row.name}}" required></label><label>Identificador<input name="identifier" value="{{row.identifier or ''}}"></label><label>Local<input name="location" value="{{row.location or ''}}"></label><label>Responsável<select name="responsible_user_id"><option></option>{% for u in users %}<option value="{{u.id}}" {% if u.id==row.responsible_user_id %}selected{% endif %}>{{u.full_name}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for x in ['REGULAR','ATENCAO','IRREGULAR','MANUTENCAO'] %}<option {% if x==row.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Validade<input type="date" name="expiry_date" value="{{row.expiry_date or ''}}"></label><label>Última verificação<input type="date" name="last_check_date" value="{{row.last_check_date or ''}}"></label><label class="span2">Notas<textarea name="notes" rows="5">{{row.notes or ''}}</textarea></label><div class="span2"><button class="primary">Salvar</button></div></form></section>{% endblock %}
