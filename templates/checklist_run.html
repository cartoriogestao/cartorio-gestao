{% extends 'base.html' %}{% block heading %}<h1>{{run.template_name}}</h1>{% endblock %}{% block content %}<section class="panel"><p>Referência: <strong>{{run.reference or '—'}}</strong> · Responsável: {{run.user_name}}</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="checklist">{% for i in items %}<div class="check-row"><label><input type="checkbox" name="checked" value="{{i.id}}" {% if i.checked %}checked{% endif %}> {{i.text}}{% if i.required %} *{% endif %}</label><input name="note_{{i.id}}" value="{{i.note or ''}}" placeholder="Observação"></div>{% endfor %}</div><div class="actions"><button name="action" value="save">Salvar</button><button class="primary" name="action" value="finish">Concluir checklist</button></div></form></section>{% endblock %}
