{% extends 'base.html' %}{% block heading %}<h1>Checklists operacionais</h1>{% endblock %}{% block content %}
{% if user.role in ['ADMIN','MANAGER'] %}<details class="panel"><summary>Criar modelo de checklist</summary><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label class="span2">Nome<input name="name" required></label><label>Setor<select name="sector"><option value="">Geral</option>{% for x in sectors %}<option>{{x}}</option>{% endfor %}</select></label><label class="span2">Itens, um por linha<textarea name="items" rows="8" required></textarea></label><div class="span2"><button class="primary">Criar modelo</button></div></form></details>{% endif %}
<div class="cards checklist-cards">{% for r in rows %}<section class="card"><h3>{{r.name}}</h3><p>{{r.sector or 'Geral'}} · {{r.item_count}} itens</p><form method="post" action="{{url_for('checklist_start',template_id=r.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input name="reference" placeholder="Referência do ato/livro/protocolo"><button class="primary">Iniciar checklist</button></form></section>{% endfor %}</div>{% endblock %}
