{% extends 'base.html' %}{% block heading %}<h1>Inspeções e planos de ação</h1>{% endblock %}{% block content %}<section class="panel"><table><thead><tr><th>Inspeção</th><th>Data</th><th>Data-base dos prazos</th><th>Concluídas</th></tr></thead><tbody>{% for r in rows %}<tr><td><a href="{{url_for('inspection_detail',inspection_id=r.id)}}">{{r.title}}</a></td><td>{{fmt_date(r.report_date)}}</td><td>{{fmt_date(r.start_date)}}</td><td>{{r.done_tasks}} / {{r.total_tasks}}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
