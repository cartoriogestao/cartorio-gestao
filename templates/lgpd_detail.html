{% extends 'base.html' %}{% block heading %}<h1>LGPD/Governança #{{row.id}}</h1>{% endblock %}{% block content %}<section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Tipo<select name="item_type">{% for x in ['Inventário de dados','RIPD','Treinamento','Política','Contrato/Operador','Incidente','Processo de tratamento','Outro'] %}<option {% if x==row.item_type %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="span2">Título<input name="title" value="{{row.title}}" required></label><label>Responsável<select name="owner_user_id"><option></option>{% for u in users %}<option value="{{u.id}}" {% if u.id==row.owner_user_id %}selected{% endif %}>{{u.full_name}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for x in ['PENDENTE','EM_REVISAO','REGULAR'] %}<option {% if x==row.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Próxima revisão<input type="date" name="review_date" value="{{row.review_date or ''}}"></label><label class="span2">Notas<textarea name="notes" rows="6">{{row.notes or ''}}</textarea></label><div class="span2"><button class="primary">Salvar</button></div></form></section>{% endblock %}
