{% extends 'base.html' %}{% block heading %}<h1>Obrigação recorrente #{{row.id}}</h1>{% endblock %}{% block content %}<section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label class="span2">Título<input name="title" value="{{row.title}}" required></label><label>Setor<select name="sector"><option></option>{% for x in sectors %}<option {% if x==row.sector %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Sistema<input name="system_name" value="{{row.system_name or ''}}"></label><label>Frequência<select name="frequency">{% for f in frequencies %}<option {% if f==row.frequency %}selected{% endif %}>{{f}}</option>{% endfor %}</select></label><label>Próximo vencimento<input type="date" name="next_due_date" value="{{row.next_due_date or ''}}"></label><label>Dia preferencial<input type="number" min="1" max="31" name="due_day" value="{{row.due_day or ''}}"></label><label>Mês anual<input type="number" min="1" max="12" name="due_month" value="{{row.due_month or ''}}"></label><label>Antecedência<input type="number" min="0" name="lead_days" value="{{row.lead_days}}"></label><label>Responsável<select name="assigned_user_id"><option></option>{% for u in users %}<option value="{{u.id}}" {% if u.id==row.assigned_user_id %}selected{% endif %}>{{u.full_name}}</option>{% endfor %}</select></label><label>Substituto<select name="backup_user_id"><option></option>{% for u in users %}<option value="{{u.id}}" {% if u.id==row.backup_user_id %}selected{% endif %}>{{u.full_name}}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="active" {% if row.active %}checked{% endif %}> Ativa</label><label class="check"><input type="checkbox" name="evidence_required" {% if row.evidence_required %}checked{% endif %}> Exigir evidência</label><label class="span2">Notas<textarea name="notes">{{row.notes or ''}}</textarea></label><div class="span2"><button class="primary">Salvar</button></div></form></section>{% endblock %}
