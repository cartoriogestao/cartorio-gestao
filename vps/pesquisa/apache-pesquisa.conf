# A pesquisa de satisfação atrás do Apache da VPS — trecho para DENTRO do
# <VirtualHost *:443> do site que já serve o portal do cliente.
# Ver LEIA-ME.md. Módulos: proxy, proxy_http, headers (a2enmod).

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /pesquisa/ http://127.0.0.1:8782/pesquisa/ timeout=60
    ProxyPassReverse /pesquisa/ http://127.0.0.1:8782/pesquisa/

    # A API do servidor da serventia: lotes pequenos (só chaves e datas).
    <Location /pesquisa/api/>
        LimitRequestBody 1048576
    </Location>
    # A página pública (a nota e o comentário): corpo pequeno.
    <LocationMatch "^/pesquisa/r/">
        LimitRequestBody 8192
    </LocationMatch>

# O link leva o código do convite no caminho (/pesquisa/r/<código>). O código
# não é dado pessoal e vale uma resposta, mas não precisa ficar no log de
# acesso: use um CustomLog próprio sem o caminho para /pesquisa/r/, ou o
# formato padrão com SetEnvIf para não registrar essas linhas, por exemplo:
#     SetEnvIf Request_URI "^/pesquisa/r/" sem_log
#     CustomLog ${APACHE_LOG_DIR}/access.log combined env=!sem_log
