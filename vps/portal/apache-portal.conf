# O portal do cliente atrás do Apache da VPS — trecho para DENTRO do
# <VirtualHost *:443> do site que já tem certificado (o mesmo do WhatsApp).
# Ver LEIA-ME.md. Módulos: proxy, proxy_http, headers (a2enmod).

    # Só o caminho do portal vai para o programa; o resto do site não muda.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /portal/ http://127.0.0.1:8781/portal/ timeout=60
    ProxyPassReverse /portal/ http://127.0.0.1:8781/portal/
    RedirectMatch 301 ^/portal$ /portal/

    # O envio do servidor da serventia traz o PDF dos recibos: até 25 MB.
    <Location /portal/api/>
        LimitRequestBody 26214400
    </Location>
    # A página pública: corpo pequeno.
    <LocationMatch "^/portal/(consultar|recibo)$">
        LimitRequestBody 4096
    </LocationMatch>

# E no <VirtualHost *:80> do mesmo site, nada do portal em HTTP — só o
# redirecionamento que o certbot já põe:
#     RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
